name: Quality Assurance

on:
  push:
    branches: [ "main" ]
  pull_request:
  schedule:
    - cron: "10 4 * * 2" # Every Tuesday at 4:10 AM UTC

permissions:
  contents: read

jobs:
  qa:
    name: Quality Checks (Pimcore ${{ matrix.pimcore-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - pimcore-version: "^11.5"
            php-version: "8.3"
          - pimcore-version: "^12.0"
            php-version: "8.4"
          - pimcore-version: "^2026.1"
            php-version: "8.5"

    steps:
      - name: Git Checkout
        uses: actions/checkout@v6

      - name: PHP Setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Require Pimcore version
        run: |
          packages=("pimcore/pimcore:${{ matrix.pimcore-version }}")

          if [ "${{ matrix.pimcore-version }}" != "^2026.1" ]; then
            packages+=("pimcore/admin-ui-classic-bundle:^1.6 || ^2.0")
          fi

          composer require --no-update "${packages[@]}"

      - name: Validate composer.json
        run: composer validate --ansi --strict

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Normalize composer.json
        run: composer normalize --ansi --dry-run --no-check-lock --no-update-lock

      - name: Check dependency issues
        run: composer dependencies:check

      - name: Check CS
        run: composer cs:check

      - name: Check PHPStan
        run: |
          if [ "${{ matrix.pimcore-version }}" = "^2026.1" ]; then
            composer phpstan -- -c phpstan-2026.neon
          else
            composer phpstan
          fi
